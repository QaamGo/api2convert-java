name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch: # enables the manual live-run path the `live` job gates on

permissions:
  contents: read

jobs:
  build:
    name: Build & test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # `mvn verify` compiles the whole surface and runs the offline unit suite. The live
      # conformance test auto-skips unless API2CONVERT_API_KEY is set, so no key is needed here.
      - name: Build and test
        run: mvn -B verify
      # examples/ is not a Maven source root, so `mvn verify` never compiles it. Compile-check the
      # runnable examples against the just-built classes so a public-API rename can't silently break
      # the copy-paste guides. Kept out of the reactor/release on purpose.
      - name: Compile examples
        run: |
          mvn -B -q dependency:build-classpath -DincludeScope=compile -Dmdep.outputFile=target/examples-classpath.txt
          javac -d target/examples-classes -cp "target/classes:$(cat target/examples-classpath.txt)" examples/*.java

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Jackson is pinned to an exact version here, and a pinned runtime dependency is the
      # one thing GitHub's alerting has historically missed on this repo — so the gate lives
      # in CI rather than relying on Dependabot noticing. osv-scanner resolves the pom's
      # transitives (jackson-core, jackson-annotations) and exits non-zero on any advisory.
      - name: Install osv-scanner
        run: |
          curl -sSfL -o /usr/local/bin/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.5.0/osv-scanner_linux_amd64
          chmod +x /usr/local/bin/osv-scanner
      - name: Audit (pom.xml, incl. transitive Maven dependencies)
        run: osv-scanner scan source -r ./

  live:
    name: Live conformance
    # Live conformance hits the real (production) API and consumes quota, so it runs only on
    # the default branch or a manual dispatch — never on pull requests. The suite is
    # @Tag("live") (excluded by `mvn verify`) and every scenario is additionally
    # @EnabledIfEnvironmentVariable on the key, so without the secret it auto-skips green
    # rather than failing a contributor's build. Mirrors live-conformance.yml, which runs the
    # same suite on tags.
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # The pom excludes the `live` group by default, so selecting it also needs excludedGroups
      # cleared; failIfNoTests keeps a fully-skipped run (no key) green. The key is scoped to
      # this step only, so the third-party checkout/setup-java actions never see it.
      - name: Live conformance (auto-skips without the key)
        env:
          API2CONVERT_API_KEY: ${{ secrets.API2CONVERT_API_KEY }}
        run: mvn -B test -Dgroups=live -DexcludedGroups= -DfailIfNoTests=false
